<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    
    <div id="app">

           <a
            href="https://www.google.com.br/"
            @click.prevent="linkClick"     
            >
            link
                 
           </a>


        <div class="container mt-5">
            <div class="mx-auto" style="width: 200px">
                {{counter}}
              <div class="input-group">
                <button class="btn btn-outline-secondary" @click="removeOne(),anotherOne($event)" type="button">-</button>
                <input type="text" value="1"  v-model="counter" class="form-control text-center" disabled>
                <button class="btn btn-outline-secondary" type="button" @click="addOne(), redirect()" >+</button>
              </div>
            </div>
          </div>
        
    </div>
   
    
</body>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const app = Vue.createApp({

        data(){
            return {
                counter: 1
            }
        },

        methods: {
            addOne(){
                this.counter+=1;
            },
            
            removeOne(){
                if (this.counter <=0) {
            
                    this.counter=0;
                }
                else{ 

                    this.counter-=1;
                } 
            },

            redirect(){
                console.log('salve');
            },

            anotherOne(evt){
                console.log(evt);
            },

            linkClick(){
                alert('link clicado');
            }
            
        },

    }).mount('#app');
</script>
</html>
