<!DOCTYPE html>
<html lang="en">
<head>
  <title>Bootstrap Example</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div id="app" class="container mt-3">
  <h2>Stacked form</h2>
  <form action="/action_page.php">
    <div class="mb-3 mt-3">
        {{email}}
      <label for="email">Email:</label>
      <input type="email" class="form-control" id="email" v-model="email" name="email">
    </div>
    
    <div class="mb-3">
        
       
        <label for="comment">Comments:</label>
        <textarea class="form-control" rows="5" v-model="textarea" id="comment" name="text"></textarea>
        <pre>{{textarea}}</pre>
      
      </div>

      <div class="form-check">
        <input type="checkbox" v-model="checkboxs" value="1" class="form-check-input" id="check1" name="option1" value="something" checked>
        <label class="form-check-label" for="check1">Option 1</label>
      </div>
      <div class="form-check">
        <input type="checkbox" v-model="checkboxs" value="2" class="form-check-input" id="check2" name="option2" value="something">
        <label class="form-check-label" for="check2">Option 2</label>
      </div>
      <div class="form-check">
        <input type="checkbox" v-model="checkboxs" value="3" class="form-check-input" >
        <label class="form-check-label">Option 3</label>
      </div>
      {{checkboxs}}
      

      <div class="form-check">
        <input type="radio" v-model="radio" class="form-check-input" id="radio1" name="optradio" value="option1" >Option 1
        <label class="form-check-label" for="radio1"></label>
      </div>
      <div class="form-check">
        <input type="radio" v-model="radio" class="form-check-input" id="radio2" name="optradio" value="option2">Option 2
        <label class="form-check-label" for="radio2"></label>
      </div>
      <div class="form-check">
        <input type="radio" v-model="radio" class="form-check-input"  value="option3">Option 3
        <label class="form-check-label"></label>
      </div>
      {{radio}}

      <div class="mb-3">
      <select  v-model="select" class="form-select">
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
      </select>
      {{select}}
    </div>


    <div class="mb-3">
        <select  v-model="multi_select" class="form-select" multiple>
          <option>1</option>
          <option>2</option>
          <option>3</option>
          <option>4</option>
        </select>
     
      </div>
      <br>
      {{multi_select}}

    <div class="mb-3">
      <label for="pwd">Password:</label>
      <input type="text" class="form-control" id="pwd"  v-model.trim="password" name="pswd">
      {{password}}
    </div>
    <div class="form-check mb-3">
      <label class="form-check-label">
        <input class="form-check-input" type="checkbox" v-model="checkboxs" value="" name="remember"> Remember me
      </label>
    </div>
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
  <script>
  const app =
    Vue.createApp({
        firstName:'Ronaldo',
       data(){

            return {
               
                email: '',
                textarea: '',
                checkbox: '',
                checkbox: false,
                checkboxs: [],
                radio: '',
                select: '',
                multi_select: '',
                password: ''
                
             
            }
       } 
    }).mount('#app');

</script>
</body>
</html>
