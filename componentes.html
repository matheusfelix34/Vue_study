<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        .container {
            max-widht: 767px;
        }
    </style>
</head>
<body>
    
    <div id="app" >

        <div class="container mt-5">
            <div class="mx-auto" style="width: 400px;">
                <card></card>
           
            </div>
           
        </div>

      
           

        
        
    </div>
    <template id="card">
        <div class="col">
            <div class="card shadow-sm">
              
                <card-image image="https://picsum.photos/300/150"></card-image>
                
              <div class="card-body">
                    <card-description></card-description>
                    <buttons></buttons>
               
              </div>

            </div>
          </div>
    </template>

    <template id="card-image">
      
        <img :src="image" alt="" class="card-img-top">
    </template>
    <template id="card-description">
        <p class="card-text">This is a wider card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.</p>
    </template>

    <template id="buttons">
        <div class="d-flex justify-content-between align-items-center">
            <div class="btn-group">
              <button type="button" class="btn btn-sm btn-outline-secondary">View</button>
              <button type="button" class="btn btn-sm btn-outline-secondary">Edit</button>
            </div>
          
          </div>
    </template>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
    
            data(){
                return {
                    counter: 1,
                    distaque:{border:'2px solid red',padding: '20px'}
                }
            },
    
            methods: {
                
                
            },
    
        })
    
        app.component('card', {
    
            data(){
                return {
                    description: 'This is a wider card with supporting text below as a natural lead-in to additional content. This content is a little bit longer.',
                   // cardImage: 'https://picsum.photos/200/300',
                }
            },
    
            template: '#card',
        })

        app.component('card-image', {
            template: '#card-image',

            props: ['image']
        })

        app.component('card-description',{
            template: '#card-description'
        })

        app.component('buttons',{
            template: '#buttons'
        })
    
        app.mount('#app');
    
    </script>
    
</body>

</html>
