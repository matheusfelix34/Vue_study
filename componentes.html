<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Page Title</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='main.css'>
    <script src='main.js'></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    <style>
        .container {
            max-widht: 767px;
        }
    </style>
</head>
<body>
    
    <div id="app" >

        <div class="container mt-5">
            <div class="mx-auto" style="width: 400px;">
                <card v-for="post in posts" :post="post"></card>
               
           
            </div>
           
        </div>

      
           

        
        
    </div>
    <template id="card">
        <div class="col">
            <div class="card shadow-sm">
              
                <card-image :image="post.image"></card-image>
                
              <div class="card-body">
                    <card-description :desc="post.description"></card-description>
                    <buttons :view="true" :edit="true"></buttons>
               
              </div>

            </div>
          </div>
    </template>

    <template id="card-image">
      
        <img :src="image" alt="" class="card-img-top">
    </template>
    <template id="card-description">
       {{desc}}
    </template>

    <template id="buttons">
        <div class="d-flex justify-content-between align-items-center">
            <div class="btn-group">
              <button v-if="view" type="button" class="btn btn-sm btn-outline-secondary">View</button>
              <button v-if="edit" type="button" class="btn btn-sm btn-outline-secondary">Edit</button>
            </div>
          
          </div>
    </template>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const app = Vue.createApp({
    
            data(){
                return {
                    posts: [
                       { description:'Descrição 1', image: 'https://picsum.photos/id/237/300/150' }, 
                       { description:'Descrição 2', image: 'https://picsum.photos/id/237/300/150' }, 
                       { description:'Descrição 3', image: 'https://picsum.photos/id/237/300/150' }, 
                       { description:'Descrição 4', image: 'https://picsum.photos/id/237/300/150' }, 
                    ]
                }
            },
    
            methods: {
                
                
            },
    
        })
    
        app.component('card', {
            template: '#card',

            props: ['post']
        })

        app.component('card-image', {
            template: '#card-image',

            props: ['image']
        })

        app.component('card-description',{
            template: '#card-description',

            props: ['desc']
        })

        app.component('buttons',{
            template: '#buttons',

            props: ['view','edit']
        })
    
        app.mount('#app');
    
    </script>
    
</body>

</html>
